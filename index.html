<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LEMMY | 뉴스 모니터링</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#222;background:#faf9f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:34px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:29px;letter-spacing:-1px;margin:8px 0}h2{font-size:18px}.muted{color:#777;font-size:13px}.panel{background:white;border:1px solid #e9e7e1;border-radius:18px;padding:22px;margin:20px 0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ddd;background:white;border-radius:9px;padding:9px 12px}button.active,.primary{background:#222;color:white;border-color:#222}input,select{padding:10px;border:1px solid #ddd;border-radius:9px;max-width:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.news{padding:18px 0;border-bottom:1px solid #eee}.news:last-child{border:0}.news a{font-weight:650;color:#222;text-decoration:none}.news a:hover{text-decoration:underline}.tag{font-size:11px;background:#f1f0eb;border-radius:5px;padding:4px 7px;margin-right:5px;display:inline-block}.keywords{display:flex;flex-wrap:wrap;gap:7px}.keyword{display:inline-flex;gap:5px;align-items:center;background:#f4f3ef;padding:7px 10px;border-radius:8px;font-size:13px}.keyword button{padding:0 3px;border:0;background:transparent}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#f5f4f0;padding:15px;border-radius:12px}.stat b{font-size:24px}#status{margin-top:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}header{align-items:start}h1{font-size:24px}}
</style></head><body><main class="wrap"><header><div><div class="muted">LEMMY INTELLIGENCE</div><h1>경쟁사·로봇 산업 뉴스</h1><div class="muted">자동 수집 · 날짜별 아카이브 · 엑셀용 다운로드</div></div><button onclick="refresh()">새로고침</button></header><div class="panel"><div class="grid"><div class="stat"><div class="muted">오늘 수집된 발행 기사</div><b id="today">—</b></div><div class="stat"><div class="muted">최근 7일 기사</div><b id="week">—</b></div></div><div class="controls"><button id="daily" class="active" onclick="setPeriod('daily')">최근 24시간</button><button id="weekly" onclick="setPeriod('weekly')">최근 7일</button><button id="all" onclick="setPeriod('all')">전체 기록</button><button id="archive" onclick="setPeriod('archive')">날짜별 조회</button></div><div class="controls" id="dateControls" style="display:none"><label for="archiveDate">기사 발행일</label><input type="date" id="archiveDate" onchange="render()"><button onclick="$('archiveDate').value='';render()">날짜 해제</button><button onclick="downloadCSV()">엑셀용 CSV 다운로드</button></div><div class="controls"><select id="category" onchange="render()"><option value="">전체 카테고리</option></select><input id="search" placeholder="제목·키워드 검색" oninput="render()"></div><div class="controls"><button onclick="downloadCSV()">현재 검색 결과 엑셀용 CSV 다운로드</button></div><div id="status" class="muted"></div><div id="articles"></div></div><section class="panel"><h2>키워드 관리</h2><p class="muted">이 브라우저에서 추가·삭제한 키워드는 개인 검색 필터에만 적용돼요. 팀 전체 자동 수집 키워드는 GitHub의 keywords.json을 수정해야 반영됩니다.</p><div class="controls"><select id="editCategory"></select><input id="newKeyword" placeholder="추가할 키워드"><button onclick="addKeyword()">추가</button><button onclick="exportConfig()">설정 JSON 내보내기</button></div><div id="keywordList"></div></section><footer class="muted">출처: Google News RSS · 기사 원문은 언론사에 귀속 · 검색 피드 누락/지연 가능 · 브라우저 키워드 변경은 자동 수집 설정에 미반영</footer></main><script>
let base={}, config={}, news=[],period='daily', visibleNews=[];const $=id=>document.getElementById(id);const localKey='lemmy-news-keywords-v1';
async function refresh(){try{const [k,n]=await Promise.all([fetch('keywords.json?t='+Date.now()),fetch('news.json?t='+Date.now())]);if(!k.ok||!n.ok)throw Error('파일을 읽지 못했습니다');base=await k.json();news=await n.json();try{config=JSON.parse(localStorage.getItem(localKey))||structuredClone(base)}catch{config=structuredClone(base)};setup();render()}catch(e){$('status').textContent='데이터 로드 실패: '+e.message}}
function setup(){const previous=$('category').value;$('category').innerHTML='<option value="">전체 카테고리</option>';$('editCategory').innerHTML='';Object.keys(config).forEach(c=>{for(const id of ['category','editCategory']){const o=document.createElement('option');o.value=c;o.textContent=c;$(id).append(o)}});$('category').value=previous in config?previous:'';renderKeywords()}
function setPeriod(p){period=p;$('dateControls').style.display=p==='archive'?'flex':'none';['daily','weekly','all','archive'].forEach(id=>$(id).classList.toggle('active',id===p));render()}
function dateKST(value){const d=new Date(value);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function render(){
 const now=Date.now(),day=86400000;
 const recent=ms=>news.filter(x=>{const t=new Date(x.published).getTime();return Number.isFinite(t)&&t<=now&&now-t<=ms});
 $('today').textContent=recent(day).length+'건';$('week').textContent=recent(7*day).length+'건';
 const cat=$('category').value,term=$('search').value.toLowerCase().trim(),enabled=new Set(Object.values(config).flat());
 const chosen=$('archiveDate').value;
 visibleNews=news.filter(x=>{
  const t=new Date(x.published).getTime();
  if(!Number.isFinite(t)||t>now)return false;
  if(period==='daily'&&now-t>day)return false;
  if(period==='weekly'&&now-t>7*day)return false;
  if(period==='archive'&&chosen&&dateKST(x.published)!==chosen)return false;
  return (!cat||(x.categories||[]).includes(cat))&&(x.keywords||[]).some(k=>enabled.has(k))&&(!term||(x.title+' '+(x.keywords||[]).join(' ')+' '+x.source).toLowerCase().includes(term));
 });
 $('status').textContent=`${visibleNews.length}건 표시 · 기사 발행일 기준 · 최초 수집일은 신규 기사부터 기록 · 보관 기간 제한 없음`;
 const container=$('articles');container.replaceChildren();
 if(!visibleNews.length){container.textContent='해당 조건의 뉴스가 없습니다.';return}
 visibleNews.slice(0,200).forEach(x=>{
  const el=document.createElement('div');el.className='news';const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.title;
  const meta=document.createElement('div');meta.className='muted';meta.style.margin='8px 0';
  meta.textContent='발행 '+new Date(x.published).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · '+(x.source||'출처 미상')+(x.first_seen?' · 최초 수집 '+dateKST(x.first_seen):'');
  el.append(a,meta);(x.categories||[]).forEach(c=>{const t=document.createElement('span');t.className='tag';t.textContent=c;el.append(t)});container.append(el)
 });
}
function downloadCSV(){
 const rows=[['발행일(KST)','최초 수집일(KST)','기사 제목','언론사','카테고리','검색 키워드','원문 URL'],...visibleNews.map(x=>[dateKST(x.published),x.first_seen?dateKST(x.first_seen):'',x.title,x.source||'',(x.categories||[]).join(' / '),(x.keywords||[]).join(' / '),x.url])];
 const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LEMMY_news_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function renderKeywords(){const el=$('keywordList');el.replaceChildren();Object.entries(config).forEach(([c,items])=>{const h=document.createElement('h3');h.textContent=c+' ('+items.length+')';el.append(h);const wrap=document.createElement('div');wrap.className='keywords';items.forEach(k=>{const s=document.createElement('span');s.className='keyword';s.append(document.createTextNode(k));const b=document.createElement('button');b.textContent='×';b.title=k+' 삭제';b.onclick=()=>{config[c]=config[c].filter(x=>x!==k);save()};s.append(b);wrap.append(s)});el.append(wrap)})}
function save(){localStorage.setItem(localKey,JSON.stringify(config));setup();render()}
function addKeyword(){const c=$('editCategory').value,k=$('newKeyword').value.trim();if(!c||!k)return;if(!config[c].includes(k))config[c].push(k);$('newKeyword').value='';save()}
function exportConfig(){const blob=new Blob([JSON.stringify(config,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='keywords.json';a.click();URL.revokeObjectURL(url)}refresh();
</script></body></html>
